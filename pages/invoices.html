        <button class="btn btn-primary" onclick="Utils.showToast('New invoice created','success')">+ New Invoice</button>

      <div class="filter-chips mb-6"><button class="filter-chip active" data-filter="all">All</button><button class="filter-chip" data-filter="paid">Paid</button><button class="filter-chip" data-filter="pending">Pending</button><button class="filter-chip" data-filter="overdue">Overdue</button><button class="filter-chip" data-filter="draft">Draft</button></div>
